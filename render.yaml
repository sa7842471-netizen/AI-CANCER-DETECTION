services:
  - type: web
    name: oncoai-backend
    runtime: python
    pythonVersion: "3.11.9"
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-deploy.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        value: fb64faf8955fbd35fb363acfb61082344d3b634bb6da41dd37ed903e4c3517f2
      - key: AES_ENCRYPTION_KEY
        value: 431f1d95410ec3101202d313c16bf21c895843235223c1697f9b7e27a1c03706
      - key: JWT_EXPIRY_MINUTES
        value: '30'
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 'false'
      - key: SQLITE_DB_PATH
        value: onco_ai.db
      - key: IDS_ENABLED
        value: 'false'
      - key: IDS_ALERT_LOG_PATH
        value: logs/ids_alerts.log
      - key: IDS_MODEL_PATH
        value: models/ids_nslkdd_model.h5
      - key: ANONYMIZE_ON_EXPORT
        value: 'true'
      - key: DATA_RETENTION_DAYS
        value: '365'
